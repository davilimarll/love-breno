<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Poema 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a0000 0%, #2d0000 25%, #3d0000 50%, #2d0000 75%, #1a0000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animação de corações caindo */
        @keyframes falling-hearts {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Corações de fundo */
        .heart-background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .heart-background::before,
        .heart-background::after {
            content: '❤️';
            position: absolute;
            font-size: 3rem;
            opacity: 0.1;
            animation: falling-hearts linear infinite;
        }

        .heart-background::before {
            animation-duration: 6s;
            left: 10%;
            animation-delay: 0s;
        }

        .heart-background::after {
            animation-duration: 8s;
            left: 80%;
            animation-delay: 2s;
        }

        /* Container principal */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            max-width: 1200px;
            padding: 2rem;
        }

        /* Imagem */
        .image-section {
            flex: 1;
            animation: floating 3s ease-in-out infinite;
        }

        .image-section img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.6),
                        0 0 80px rgba(255, 20, 147, 0.4);
            transition: transform 0.3s ease;
        }

        .image-section img:hover {
            transform: scale(1.05);
        }

        /* Conteúdo de texto */
        .content-section {
            flex: 1;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff69b4;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.8),
                         0 0 60px rgba(255, 20, 147, 0.6);
            margin-bottom: 1.5rem;
            animation: floating 3s ease-in-out infinite;
        }

        .poema-text {
            color: #ffb6c1;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        .back-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .back-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 20, 147, 0.8);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .poema-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="heart-background"></div>
    
    <div class="container">
        <div class="image-section">
            <img src="https://raw.githubusercontent.com/davilimarll/love-breno/main/Gemini_Generated_Image_lpnl5qlpnl5qlpnl.jpg" alt="Nosso Amor" onerror="console.log('Erro ao carregar imagem')">
        </div>

        <div class="content-section">
            <h1>💕 Nosso Poema 💕</h1>
            
            <div class="poema-text">
                <p>Escuta a sua voz em cada verso,</p>
                <p>Sinto nosso amor no universo,</p>
                <p>Cinco anos passaram que parecem um dia,</p>
                <p>Contigo meu coração se faz magia...</p>
                <br>
                <p>Porque, meu amor, é verdade,</p>
                <p>Eu pertenço a você com sinceridade,</p>
                <p>Em cada momento, em cada respiração,</p>
                <p>Você é meu amor, minha proteção.</p>
            </div>

            <button class="back-btn" onclick="window.location.href='index.html'">Voltar</button>
        </div>
    </div>

    <audio id="audioPlayer" autoplay>
        <source src="https://raw.githubusercontent.com/davilimarll/love-breno/main/Lila-_1_.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Toca o áudio automaticamente
        const audio = document.getElementById('audioPlayer');
        
        audio.play().catch(() => {
            console.log('Auto-play bloqueado. Clique na página para tocar.');
            document.addEventListener('click', () => {
                audio.play();
            }, { once: true });
        });

        window.addEventListener('load', () => {
            audio.play();
        });
    </script>
</body>
</html>
